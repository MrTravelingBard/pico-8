name: Dynamic Multi-Game Deployer

on:
  push:
    branches: [ main ]
    #Only run the workflow if files change inside a project folder
    paths:
      - 'even-a-slime-can-win/**'
      - 'knights-of-power-last-light/**'
  workflow_dispatch: #Allows manual re-runs from the Actions tab
    inputs:
      project:
        description: 'Project to force-deploy (leave as "auto-detect" to use git diff, like a push would)'
        required: true
        default: 'auto-detect'
        type: choice
        options:
          - auto-detect
          - even-a-slime-can-win
          - knights-of-power-last-light
          - both

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.info.outputs.projects }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 #Required to compare changes with the previous commit

      - name: Identify Modified Projects
        id: info
        run: |
          #Manual runs (workflow_dispatch) let you force which project(s) deploy,
          #since a manual run has no natural "previous commit" to diff against.
          MANUAL_PROJECT="${{ github.event.inputs.project }}"

          if [ "$MANUAL_PROJECT" = "even-a-slime-can-win" ] || [ "$MANUAL_PROJECT" = "knights-of-power-last-light" ]; then
            echo "Manual override: deploying $MANUAL_PROJECT only."
            echo "projects=[\"$MANUAL_PROJECT\"]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$MANUAL_PROJECT" = "both" ]; then
            echo "Manual override: deploying both projects."
            echo 'projects=["even-a-slime-can-win","knights-of-power-last-light"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          #Otherwise (push events, or manual "auto-detect") fall back to diffing the last commit.
          #Detect all supported game folders changed in the last commit (not just the first)
          CHANGED_DIRS=$(git diff --name-only HEAD~1 | grep -E '^(even-a-slime-can-win|knights-of-power-last-light)/' | cut -d'/' -f1 | sort -u)

          if [ -z "$CHANGED_DIRS" ]; then
            echo "No supported game folder modifications detected."
            echo "projects=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Detected changes in:"
          echo "$CHANGED_DIRS"

          #Convert newline-separated list into a JSON array for the matrix, e.g. ["even-a-slime-can-win","knights-of-power-last-light"]
          JSON=$(printf '%s\n' "$CHANGED_DIRS" | jq -R . | jq -sc .)
          echo "projects=$JSON" >> "$GITHUB_OUTPUT"

  deploy:
    needs: detect
    if: needs.detect.outputs.projects != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write #Needed to push to gh-pages
    strategy:
      fail-fast: false #One project failing shouldn't cancel the other's deploy
      matrix:
        project: ${{ fromJson(needs.detect.outputs.projects) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Butler CLI (itch.io)
        uses: remarkablegames/setup-butler@v3

      - name: Deploy to itch.io
        run: |
          butler push ./${{ matrix.project }}/build TravelingBardStudios/${{ matrix.project }}:web
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}

      - name: Deploy to GitHub Pages (Subdirectory)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ./${{ matrix.project }}/build
          target-folder: docs/${{ matrix.project }} #Saves to a sub-folder on your pages branch
          branch: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}